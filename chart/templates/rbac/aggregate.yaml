{{- if and .Values.rbac.create .Values.rbac.aggregateClusterRoles }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "polars-k8s-operator.clusterResourceName" (dict "suffix" "view" "context" $) }}
  labels:
    {{- include "polars-k8s-operator.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
- apiGroups:
  - compute.pola.rs
  resources:
  - polarsclusters
  - polarsclusters/status
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "polars-k8s-operator.clusterResourceName" (dict "suffix" "edit" "context" $) }}
  labels:
    {{- include "polars-k8s-operator.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
- apiGroups:
  - compute.pola.rs
  resources:
  - polarsclusters
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
{{- end }}
