{{- if .Values.rbac.create }}
{{- $role := include "polars-k8s-operator.generatedFile" (dict "path" "files/manager-role.yaml" "context" $) | fromYaml }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "Role" "ClusterRole" .Values.rbac.namespaced }}
metadata:
  name: {{ include "polars-k8s-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
  {{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "polars-k8s-operator.labels" . | nindent 4 }}
rules:
{{ toYaml $role.rules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "RoleBinding" "ClusterRoleBinding" .Values.rbac.namespaced }}
metadata:
  name: {{ include "polars-k8s-operator.resourceName" (dict "suffix" "manager-rolebinding" "context" $) }}
  {{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "polars-k8s-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "Role" "ClusterRole" .Values.rbac.namespaced }}
  name: {{ include "polars-k8s-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "polars-k8s-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
