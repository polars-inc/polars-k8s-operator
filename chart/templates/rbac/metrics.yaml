{{- if and .Values.rbac.create .Values.metrics.enabled .Values.metrics.secure }}
{{- /* TokenReview and SubjectAccessReview are cluster-scoped, so these stay ClusterRoles when rbac.namespaced is set. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "polars-k8s-operator.clusterResourceName" (dict "suffix" "metrics-auth-role" "context" $) }}
  labels:
    {{- include "polars-k8s-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "polars-k8s-operator.clusterResourceName" (dict "suffix" "metrics-auth-rolebinding" "context" $) }}
  labels:
    {{- include "polars-k8s-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "polars-k8s-operator.clusterResourceName" (dict "suffix" "metrics-auth-role" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "polars-k8s-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
{{- /* Bind this to whatever scrapes /metrics. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "polars-k8s-operator.clusterResourceName" (dict "suffix" "metrics-reader" "context" $) }}
  labels:
    {{- include "polars-k8s-operator.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
{{- end }}
