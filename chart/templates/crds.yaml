{{- if .Values.crds.enabled }}
{{- $crds := .Files.Glob "files/crds/*.yaml" }}
{{- if not $crds }}
{{- fail "files/crds/ is empty; run `make chart` to copy the CRDs from config/crd/bases" }}
{{- end }}
{{- range $path, $_ := $crds }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $labels := merge (include "polars-k8s-operator.labels" $ | fromYaml) (default (dict) $crd.metadata.labels) }}
{{- $_ := set $crd.metadata "labels" $labels }}
{{- if $.Values.crds.keep }}
{{- $annotations := merge (dict "helm.sh/resource-policy" "keep") (default (dict) $crd.metadata.annotations) }}
{{- $_ := set $crd.metadata "annotations" $annotations }}
{{- end }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
