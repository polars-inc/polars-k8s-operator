---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - compute.pola.rs
  resources:
  - polarsclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - compute.pola.rs
  resources:
  - polarsclusters/finalizers
  verbs:
  - update
- apiGroups:
  - compute.pola.rs
  resources:
  - polarsclusters/status
  verbs:
  - get
  - patch
  - update
