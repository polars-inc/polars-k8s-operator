apiVersion: compute.pola.rs/v1
kind: PolarsCluster
metadata:
  labels:
    app.kubernetes.io/name: k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: polars
spec:
  acceptEula: true
  # Version of Polars on-premises to run. Used as the dist image tag unless
  # runtime.composed.dist.tag overrides it.
  version: "latest"
  license:
    onPremEnterprise:
      # Create this Secret from your Polars on-premises enterprise license:
      #   kubectl create secret generic license --from-file=license.json=<path to license>
      secretName: license
      secretProperty: license.json
  runtime:
    composed:
      dist:
        repository: polars-on-premises
        pullPolicy: IfNotPresent
  schedulerSpec: {}
  workerPool:
    minReplicas: 1
    maxReplicas: 3
    replicas: 2
