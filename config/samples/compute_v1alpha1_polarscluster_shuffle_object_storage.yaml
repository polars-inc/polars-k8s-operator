# Shuffle data on object storage instead of local disk. This is used only
# during query execution. Local (emptyDir/ephemeral volume) storage is
# recommended for performance; object storage is an alternative when you
# lack fast local disks. Shown here for AWS S3 — Azure Blob Storage and
# Google Cloud Storage work the same way via workerPool.shuffleData.abs /
# .gcs, whose "endpoint" URI scheme (az://, gs://) and option key names
# differ (see docs/api.md).
apiVersion: compute.pola.rs/v1alpha1
kind: PolarsCluster
metadata:
  name: polars-shuffle-object-storage
spec:
  acceptEula: true
  license:
    onPremEnterprise:
      secretName: license
      secretProperty: license.json
  runtime:
    composed: {}
  workerPool:
    replicas: 2
    shuffleData:
      s3:
        endpoint: "s3://my-storage-location/path/to/dir"
        options:
          - name: aws_access_key_id
            valueFrom:
              secretKeyRef:
                name: my-s3-secret
                key: accessKeyId
          - name: aws_secret_access_key
            valueFrom:
              secretKeyRef:
                name: my-s3-secret
                key: secretAccessKey
