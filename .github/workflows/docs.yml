name: Docs

on:
  push:
  pull_request:

permissions: {}

jobs:
  check-api-docs:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Regenerate API reference docs
        run: make api-docs

      - name: Verify docs are up to date
        run: |
          git diff --exit-code -- docs/ || {
            echo "::error::docs/ is out of date. Run 'make api-docs' and commit the result."
            exit 1
          }
